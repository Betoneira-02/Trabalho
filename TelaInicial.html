<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoio ao cumprimento de Metas nas Plataformas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TELA INICIAL -->
  <section id="tela-inicial" class="tela ativa">
    <!-- Botão no canto superior direito -->
    <button id="btn-nova-tela" class="btn btn-topo-direito" type="button">
      Informações
    </button>

    <!-- Conteúdo centralizado e um pouco elevado -->
    <div class="conteudo-central">
      <h1 class="titulo-principal">Apoio ao cumprimento de Metas nas Plataformas.</h1>
      <button id="btn-pedir-dicas" class="btn btn-primario" type="button">
        Pedir Dicas
      </button>
    </div>
  </section>

  <!-- SEGUNDA TELA (mesma coloração da tela inicial, para você preencher) -->
  <section id="tela-personalizada" class="tela">
    <!-- Botão "voltar" no canto superior esquerdo -->
    <button id="btn-voltar" class="btn btn-topo-esquerdo" type="button">
      Voltar
    </button>

    <div class="conteudo-personalizado">
      <!-- Adicione aqui as informações que você quiser -->
    </div>
  </section>

  <!-- TELA PRÉ-EXISTENTE (exemplo caso ainda não esteja no DOM) -->
  <section id="tela-dicas" class="tela">
    <div class="conteudo-central">
      <h2>Tela de Dicas</h2>
      <p>Sua tela pré-existente de dicas entra aqui.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
